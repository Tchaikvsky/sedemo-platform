# Backstop: prod images must be signed by CI.
#
# Mirrors the prod-controls signature check at admission time, so an image
# that never went through Kargo still can't run in prod unsigned. CBA already
# enforces image signing with Kyverno; this is the same pattern.
#
# Starts in Audit (reports, doesn't block). Switch to Enforce once the CI
# workflow signs images (see ../ci/sign-images.yaml) and
# checks.signature.enabled is on in kargo-chart/platform-controls.yaml.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: governed-prod-verify-images
  annotations:
    policies.kyverno.io/title: Prod images are signed by CI
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  background: false
  rules:
  - name: ci-signature
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - gov-*-prod
      - resources:
          kinds:
          - Pod
          namespaceSelector:
            matchLabels:
              tier: prod
    verifyImages:
    - imageReferences:
      - "ghcr.io/akuity/*"
      attestors:
      - entries:
        - keyless:
            subjectRegExp: '^https://github\.com/akuity/sedemo-monorepo/\.github/workflows/.+$'
            issuer: https://token.actions.githubusercontent.com
            rekor:
              url: https://rekor.sigstore.dev
      mutateDigest: false
      verifyDigest: false
      required: true
