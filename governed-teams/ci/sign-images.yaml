# Add to the image build workflow in akuity/sedemo-monorepo to sign images
# with cosign keyless (GitHub OIDC, no keys to manage).
#
# What it gives the demo:
#   - prod-controls' signature check (checks.signature.enabled in
#     kargo-chart/platform-controls.yaml) can pass
#   - the Kyverno backstop (cluster-policies/prod-verify-images.yaml) can be
#     switched to Enforce
#
# For scene 3's "unsigned image" Freight: push one tag without running this
# job (or from a branch where it's skipped). prod-controls blocks it at the
# signature check.
#
# Merge these pieces into the existing build job, after the image is pushed.
# The job needs the image digest; docker/build-push-action exposes it as
# steps.<id>.outputs.digest.

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless signing uses the workflow's OIDC token

jobs:
  build:
    steps:
      # ... existing checkout, login and build-push steps; give the build step
      # id: build so its digest is available ...

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          IMAGE: ghcr.io/akuity/sedemo-monorepo-rollouts-app
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
